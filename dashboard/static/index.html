<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IPS — SIEM Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --alert: #f85149; --block: #d29922; --ok: #3fb950; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 18px; letter-spacing: .04em; }
  #conn { font-size: 12px; color: var(--muted); }
  #conn.live { color: var(--ok); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card .value.alert { color: var(--alert); } .card .value.block { color: var(--block); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .panel h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 4px 8px; border-bottom: 1px solid #21262d; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  #feed-wrap { max-height: 420px; overflow-y: auto; }
  .tag { padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .tag.ALERT { background: rgba(248,81,73,.15); color: var(--alert); }
  .tag.BLOCK { background: rgba(210,153,34,.18); color: var(--block); }
  .tag.INFO  { background: rgba(88,166,255,.12); color: var(--accent); }
  .tag.WARNING, .tag.ERROR { background: rgba(210,153,34,.18); color: var(--block); }
  .inject { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; align-items: start; }
  .inject textarea { width: 100%; min-height: 54px; resize: vertical; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: 12px ui-monospace, Consolas, monospace; }
  .inject input, .inject select { background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 8px; font: 12px "Segoe UI", system-ui, sans-serif; width: 100%; }
  .inject .col { display: flex; flex-direction: column; gap: 6px; }
  .btn { background: var(--accent); color: #0d1117; border: 0; border-radius: 6px; padding: 8px 14px;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 14px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  #inject-result { margin-top: 8px; font-size: 12px; font-family: ui-monospace, monospace; min-height: 16px; }
  #inject-result.hit { color: var(--alert); } #inject-result.clean { color: var(--ok); }
  #inject-result.err { color: var(--block); }
</style>
</head>
<body>
<header>
  <h1>IPS — SIEM DASHBOARD</h1>
  <span id="conn">connecting…</span>
</header>

<div class="cards">
  <div class="card"><div class="label">Total Events</div><div class="value" id="c-total">0</div></div>
  <div class="card"><div class="label">Alerts</div><div class="value alert" id="c-alerts">0</div></div>
  <div class="card"><div class="label">Blocked IPs</div><div class="value block" id="c-blocked">0</div></div>
  <div class="card"><div class="label">Avg Detection</div><div class="value" id="c-avg">0 ms</div></div>
</div>

<div class="panel" id="inject-panel" style="margin-bottom:16px">
  <h2>Inject Synthetic Traffic</h2>
  <div class="presets" id="presets"></div>
  <div class="inject">
    <div class="col">
      <textarea id="inj-payload" placeholder="Request payload, e.g.  GET /search?q=UNION SELECT ... HTTP/1.1"></textarea>
    </div>
    <div class="col">
      <select id="inj-port" title="Destination port"></select>
      <input id="inj-ip" placeholder="src IP (optional)" />
    </div>
    <div class="col">
      <button class="btn" id="inj-send">Inject &raquo;</button>
    </div>
  </div>
  <div id="inject-result"></div>
</div>

<div class="grid" style="margin-bottom:12px">
  <div class="panel"><h2>Events Over Time (per minute)</h2><canvas id="timeline" height="90"></canvas></div>
  <div class="panel"><h2>Attack Mix</h2><canvas id="attackmix" height="180"></canvas></div>
</div>

<div class="grid">
  <div class="panel">
    <h2>Live Event Feed</h2>
    <div id="feed-wrap">
      <table>
        <thead><tr><th>Time</th><th>Type</th><th>Source IP</th><th>Port</th><th>Attack</th></tr></thead>
        <tbody id="feed"></tbody>
      </table>
    </div>
  </div>
  <div>
    <div class="panel" style="margin-bottom:12px">
      <h2>Top Attacking Sources</h2>
      <table><thead><tr><th>IP</th><th>Alerts</th></tr></thead><tbody id="top-sources"></tbody></table>
    </div>
    <div class="panel">
      <h2>Blocked IPs</h2>
      <table><thead><tr><th>IP</th><th>Blocked At</th></tr></thead><tbody id="blocked"></tbody></table>
    </div>
  </div>
</div>

<script>
const MAX_ROWS = 100;
const esc = s => String(s ?? "—").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function addRow(ev, prepend = true) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${esc(ev.timestamp)}</td>` +
    `<td><span class="tag ${esc(ev.event_type)}">${esc(ev.event_type)}</span></td>` +
    `<td>${esc(ev.src_ip)}</td><td>${esc(ev.port)}</td><td>${esc(ev.attack ?? ev.message)}</td>`;
  const feed = document.getElementById("feed");
  prepend ? feed.prepend(tr) : feed.append(tr);
  while (feed.rows.length > MAX_ROWS) feed.deleteRow(-1);
}

let timelineChart, mixChart;
const PALETTE = ["#f85149","#d29922","#58a6ff","#3fb950","#bc8cff","#f0883e","#79c0ff","#ff7b72","#d2a8ff","#7ee787"];

function renderCharts(s) {
  const labels = s.timeline.map(p => p.time);
  const totals = s.timeline.map(p => p.total);
  const alerts = s.timeline.map(p => p.alerts);
  if (!timelineChart) {
    timelineChart = new Chart(document.getElementById("timeline"), {
      type: "line",
      data: { labels, datasets: [
        { label: "All events", data: totals, borderColor: "#58a6ff", backgroundColor: "rgba(88,166,255,.15)", fill: true, tension: .3, pointRadius: 0 },
        { label: "Alerts", data: alerts, borderColor: "#f85149", backgroundColor: "rgba(248,81,73,.15)", fill: true, tension: .3, pointRadius: 0 },
      ]},
      options: { animation: false, plugins: { legend: { labels: { color: "#8b949e" } } },
        scales: { x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
                  y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" }, beginAtZero: true } } }
    });
  } else {
    timelineChart.data.labels = labels;
    timelineChart.data.datasets[0].data = totals;
    timelineChart.data.datasets[1].data = alerts;
    timelineChart.update("none");
  }

  const names = Object.keys(s.by_attack);
  const counts = names.map(n => s.by_attack[n]);
  if (!mixChart) {
    mixChart = new Chart(document.getElementById("attackmix"), {
      type: "doughnut",
      data: { labels: names, datasets: [{ data: counts, backgroundColor: PALETTE, borderColor: "#161b22" }] },
      options: { animation: false, plugins: { legend: { position: "right", labels: { color: "#8b949e", boxWidth: 10, font: { size: 10 } } } } }
    });
  } else {
    mixChart.data.labels = names;
    mixChart.data.datasets[0].data = counts;
    mixChart.update("none");
  }
}

async function refreshStats() {
  const r = await fetch("/api/stats");
  if (!r.ok) return;
  const s = await r.json();
  document.getElementById("c-total").textContent = s.total_events;
  document.getElementById("c-alerts").textContent = s.by_type.ALERT || 0;
  document.getElementById("c-blocked").textContent = s.blocked_ips.length;
  document.getElementById("c-avg").textContent = s.avg_response_ms + " ms";
  document.getElementById("top-sources").innerHTML =
    s.top_sources.map(t => `<tr><td>${esc(t.ip)}</td><td>${t.alerts}</td></tr>`).join("");
  document.getElementById("blocked").innerHTML =
    s.blocked_ips.map(b => `<tr><td>${esc(b.ip)}</td><td>${esc(b.blocked_at)}</td></tr>`).join("");
  renderCharts(s);
}

async function backfill() {
  const r = await fetch("/api/events/recent");
  if (!r.ok) return;
  (await r.json()).slice(-MAX_ROWS).forEach(ev => addRow(ev));
}

function connect() {
  const es = new EventSource("/api/events/stream");
  const conn = document.getElementById("conn");
  es.onopen = () => { conn.textContent = "● live"; conn.className = "live"; };
  es.onerror = () => { conn.textContent = "reconnecting…"; conn.className = ""; };
  es.onmessage = m => addRow(JSON.parse(m.data));
}

let PRESETS = [];

async function loadPresets() {
  const r = await fetch("/api/inject/presets");
  if (!r.ok) return;
  const cfg = await r.json();
  const panel = document.getElementById("inject-panel");
  if (!cfg.enabled) { panel.style.display = "none"; return; }

  const portSel = document.getElementById("inj-port");
  portSel.innerHTML = cfg.ports.map(p => `<option value="${p}">${p}</option>`).join("");

  PRESETS = cfg.presets;
  document.getElementById("presets").innerHTML =
    PRESETS.map((p, i) => `<button class="chip" data-i="${i}">${esc(p.label)}</button>`).join("");
  document.querySelectorAll("#presets .chip").forEach(chip => {
    chip.onclick = () => {
      const p = PRESETS[chip.dataset.i];
      document.getElementById("inj-payload").value = p.payload;
      document.getElementById("inj-port").value = p.port;
    };
  });
}

async function sendInjection() {
  const out = document.getElementById("inject-result");
  const payload = document.getElementById("inj-payload").value;
  const port = parseInt(document.getElementById("inj-port").value, 10);
  const src_ip = document.getElementById("inj-ip").value.trim();
  if (!payload.trim()) { out.className = "err"; out.textContent = "Enter a payload first."; return; }

  const btn = document.getElementById("inj-send");
  btn.disabled = true;
  try {
    const r = await fetch("/api/inject", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ payload, port, src_ip: src_ip || null }),
    });
    const d = await r.json();
    if (!r.ok) { out.className = "err"; out.textContent = "Error: " + esc(d.error || r.status); return; }
    if (d.matched) {
      out.className = "hit";
      out.textContent = `DETECTED ${d.matched} from ${d.src_ip}:${d.port} in ${d.detection_ms}ms`
        + (d.blocked ? " — source BLOCKED (simulated)" : "");
    } else {
      out.className = "clean";
      out.textContent = `No signature matched (${d.src_ip}:${d.port}) — request would pass`;
    }
    refreshStats();
  } catch (e) {
    out.className = "err"; out.textContent = "Request failed: " + esc(e.message);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("inj-send").onclick = sendInjection;
// Ctrl/Cmd+Enter sends from the payload box, so an analyst can inject a burst
// without reaching for the mouse between requests.
document.getElementById("inj-payload").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); sendInjection(); }
});
loadPresets();

backfill().then(() => { connect(); refreshStats(); setInterval(refreshStats, 5000); });
</script>
</body>
</html>
